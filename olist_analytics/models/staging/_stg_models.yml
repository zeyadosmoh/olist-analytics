version: 2

models:
  - name: stg_orders
    description: Orders with typed lifecycle timestamps.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]

  - name: stg_order_items
    description: Items within each order, with price and freight as numerics.
    columns:
      - name: order_item_key
        description: Primary key, order_id + '-' + item_number.
        data_tests: [unique, not_null]

  - name: stg_order_payments
    description: Payments for each order; an order may have several.
    columns:
      - name: order_payment_key
        description: Primary key, order_id + '-' + payment_sequence.
        data_tests: [unique, not_null]

  - name: stg_customers
    description: Customers keyed by the per-order customer_id.
    columns:
      - name: customer_id
        description: Primary key (one per order).
        data_tests: [unique, not_null]

  - name: stg_products
    description: Product catalog with cleaned column names and numeric dimensions.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]

  - name: stg_order_reviews
    description: Customer reviews. One row per (review, order) pair.
    columns:
      - name: review_key
        description: Primary key, review_id + '-' + order_id.
        data_tests: [unique, not_null]
      - name: score
        description: Review score from 1 (worst) to 5 (best).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_sellers
    description: Sellers and their location.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests: [unique, not_null]

  - name: stg_product_category_translation
    description: Lookup from Portuguese to English category names.
    columns:
      - name: category_name
        description: Primary key, Portuguese category name.
        data_tests: [unique, not_null]
