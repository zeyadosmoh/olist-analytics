# Connection profile for the local Postgres container.
# Credentials are read from environment variables (see ../.env); never hardcode them here.
olist_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5433') | int }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: olist
      schema: analytics
      threads: 4
